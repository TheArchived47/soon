<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>G,U ESS    WH O</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000000; /* Fully black */
      color: #FF0000; /* Red text */
      text-align: center;
      overflow: hidden;
    }

    /* LOAD DATA SCREEN */
    #loadScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #loadButton {
      background: #FF0000;
      color: #000000;
      padding: 20px 40px;
      font-size: 22px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* CD icon */
    #loadButton::before {
      content: "💿";
      font-size: 26px;
    }

    /* PASSWORD SCREEN */
    #passwordScreen {
      display: none;
      padding-top: 80px;
    }

    /* Typewriter effect */
    #typewriter {
      font-size: 24px;
      border-right: 2px solid #FF0000; /* Red cursor */
      width: fit-content;
      margin: 0 auto 20px auto;
      white-space: nowrap;
      overflow: hidden;
      animation: blinkCursor 0.7s step-end infinite alternate;
    }

    @keyframes blinkCursor {
      from { border-right-color: #FF0000; }
      to { border-right-color: transparent; }
    }

    /* Centered image with white background panel */
    #secretImage {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 60vw;
      height: auto;
      max-height: 70vh;

      object-fit: contain;

      background: white;
      padding: 20px;
      border: 3px solid #87CEFA; /* Baby blue border */
      box-shadow: 0 0 40px rgba(255,255,255,0.4);

      opacity: 0;
      z-index: 9999;
      animation: fadeInImage 1.2s forwards;
    }

    @keyframes fadeInImage {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Wrong password shake */
    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }
    .shake { animation: shake 0.4s; }

    input {
      padding: 10px;
      font-size: 18px;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #FF0000;
      color: #000000;
    }

    input::placeholder {
      color: #000000; /* Black placeholder */
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-left: 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #FF0000;
      color: #000000;
    }
  </style>
</head>
<body>

  <!-- LOAD DATA SCREEN -->
  <div id="loadScreen">
    <button id="loadButton" onclick="startExperience()">LOAD DATA</button>
  </div>

  <!-- PASSWORD SCREEN -->
  <div id="passwordScreen">
    <div id="typewriter"></div>

    <input type="password" id="passwordInput" placeholder="Password">
    <button onclick="checkPassword()">Submit</button>
  </div>

  <!-- Secret image -->
  <img id="secretImage" src="spoiler.png" alt="Secret Image">

  <!-- Audio -->
  <audio id="secretAudio" src="excusemejacob.ogg"></audio>
  <audio id="loopAudio" src="compooper.mp3" loop></audio>

  <script>
    /* TYPEWRITER EFFECT */
    const text = "Enter Password";
    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        document.getElementById("typewriter").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 80);
      }
    }

    /* START EXPERIENCE */
    function startExperience() {
      document.getElementById("loadScreen").style.display = "none";
      document.getElementById("passwordScreen").style.display = "block";

      /* Start looping audio now that user interacted */
      const loopAudio = document.getElementById("loopAudio");
      loopAudio.play().catch(() => {});

      typeWriter();
    }

    /* PASSWORD CHECK */
    function checkPassword() {
      const inputBox = document.getElementById("passwordInput");
      const input = inputBox.value.toLowerCase();
      const correctPassword = "excuse me pwned";

      const loopAudio = document.getElementById("loopAudio");

      if (input === correctPassword.toLowerCase()) {

        /* Stop looping audio */
        loopAudio.pause();
        loopAudio.currentTime = 0;

        /* Switch background to white */
        document.body.style.backgroundColor = "#FFFFFF";

        /* Change typewriter text to white */
        const typewriter = document.getElementById("typewriter");
        typewriter.style.color = "#FFFFFF";

        /* Change cursor to white too */
        typewriter.style.borderRightColor = "#FFFFFF";

        /* Show centered image */
        const img = document.getElementById("secretImage");
        img.style.display = "block";

        /* Play main audio */
        const audio = document.getElementById("secretAudio");
        audio.play();

      } else {
        inputBox.classList.add("shake");
        setTimeout(() => {
          inputBox.classList.remove("shake");
        }, 400);
      }
    }
  </script>

</body>
</html>
