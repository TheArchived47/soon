<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>G,U ESS    WH O</title>

  <style>
    /* GLOBAL CRT FILTER */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 20000;

      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 2px,
        rgba(0,0,0,0.05) 2px,
        rgba(0,0,0,0.05) 4px
      );

      animation: crtFlicker 0.08s infinite;
    }

    @keyframes crtFlicker {
      0% { opacity: 0.95; }
      50% { opacity: 1; }
      100% { opacity: 0.93; }
    }

    body {
      filter: contrast(1.15) brightness(1.05);
      font-family: Arial, sans-serif;
      background-color: #000000;
      color: #FF0000;
      text-align: center;
      overflow: hidden;
    }

    /* LOAD DATA SCREEN */
    #loadScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #loadButton {
      background: #FF0000;
      color: #000000;
      padding: 20px 40px;
      font-size: 22px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #loadButton::before {
      content: "💿";
      font-size: 26px;
    }

    /* PASSWORD SCREEN */
    #passwordScreen {
      display: none;
      padding-top: 80px;
    }

    #typewriter {
      font-size: 24px;
      border-right: 2px solid #FF0000;
      width: fit-content;
      margin: 0 auto 20px auto;
      white-space: nowrap;
      overflow: hidden;
      animation: blinkCursor 0.7s step-end infinite alternate;
    }

    @keyframes blinkCursor {
      from { border-right-color: #FF0000; }
      to { border-right-color: transparent; }
    }

    /* First reveal image — NOW PERFECTLY CENTERED */
    #secretImage {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -47%); /* PERFECT CENTERING */
      width: 60vw;
      max-height: 70vh;
      background: white;
      padding: 20px;
      border: 3px solid #87CEFA;
      box-shadow: 0 0 40px rgba(255,255,255,0.4);
      opacity: 0;
      z-index: 9999;
      animation: fadeInImage 1.2s forwards;
    }

    @keyframes fadeInImage {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Wrong password shake */
    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }
    .shake { animation: shake 0.4s; }

    input {
      padding: 10px;
      font-size: 18px;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #FF0000;
      color: #000000;
    }

    input::placeholder {
      color: #000000;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-left: 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #FF0000;
      color: #000000;
    }

    /* FLASH SCREEN */
    #flashScreen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10000;
    }

    /* FINAL ROTATING IMAGE — SMALLER */
    #finalImage {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 15vw;
      opacity: 0;
      z-index: 10001;
      animation: fadeInFinal 2s forwards, rotateForever 6s linear infinite;
    }

    @keyframes fadeInFinal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes rotateForever {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- LOAD DATA SCREEN -->
  <div id="loadScreen">
    <button id="loadButton" onclick="startExperience()">LOAD DATA</button>
  </div>

  <!-- PASSWORD SCREEN -->
  <div id="passwordScreen">
    <div id="typewriter"></div>

    <input type="password" id="passwordInput" placeholder="Password">
    <button onclick="checkPassword()">Submit</button>
  </div>

  <!-- First reveal image -->
  <img id="secretImage" src="spoiler.png" alt="Secret Image">

  <!-- Flash screen -->
  <div id="flashScreen"></div>

  <!-- Final rotating image -->
  <img id="finalImage" src="spookyscaryceedeesnutz.jpg">

  <!-- Audio -->
  <audio id="secretAudio" src="excusemejacob.ogg"></audio>
  <audio id="loopAudio" src="compooper.mp3" loop></audio>
  <audio id="finalAudio" src="timeisticking.mp3" loop></audio>

  <script>
    const text = "Enter Password";
    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        document.getElementById("typewriter").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 80);
      }
    }

    function startExperience() {
      document.getElementById("loadScreen").style.display = "none";
      document.getElementById("passwordScreen").style.display = "block";

      const loopAudio = document.getElementById("loopAudio");
      loopAudio.play().catch(() => {});

      typeWriter();
    }

    function checkPassword() {
      const inputBox = document.getElementById("passwordInput");
      const input = inputBox.value.toLowerCase();
      const correctPassword = "excuse me pwned";

      const loopAudio = document.getElementById("loopAudio");

      if (input === correctPassword.toLowerCase()) {

        loopAudio.pause();
        loopAudio.currentTime = 0;

        document.body.style.backgroundColor = "#FFFFFF";

        const typewriter = document.getElementById("typewriter");
        typewriter.style.color = "#FFFFFF";
        typewriter.style.animation = "none";
        typewriter.style.borderRight = "2px solid #FFFFFF";

        const img = document.getElementById("secretImage");
        img.style.display = "block";

        const audio = document.getElementById("secretAudio");
        audio.play();

        setTimeout(triggerFinalSequence, 78000);

      } else {
        inputBox.classList.add("shake");
        setTimeout(() => {
          inputBox.classList.remove("shake");
        }, 400);
      }
    }

    function triggerFinalSequence() {
      const flash = document.getElementById("flashScreen");

      flash.style.display = "block";
      flash.style.backgroundColor = "#FFFFFF";

      setTimeout(() => {
        flash.style.backgroundColor = "#000000";

        setTimeout(() => {
          const finalImg = document.getElementById("finalImage");
          finalImg.style.display = "block";

          const finalAudio = document.getElementById("finalAudio");
          finalAudio.play();

        }, 2000);

      }, 200);
    }
  </script>

</body>
</html>
