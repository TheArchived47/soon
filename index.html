<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>G,U ESS    WH O</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000000; /* Fully black */
      color: #FF0000; /* Red text */
      text-align: center;
      padding-top: 80px;
      overflow: hidden;
    }

    /* Typewriter effect */
    #typewriter {
      font-size: 24px;
      border-right: 2px solid #FF0000; /* Red cursor */
      width: fit-content;
      margin: 0 auto 20px auto;
      white-space: nowrap;
      overflow: hidden;
      animation: blinkCursor 0.7s step-end infinite alternate;
    }

    /* Cursor blink */
    @keyframes blinkCursor {
      from { border-right-color: #FF0000; }
      to { border-right-color: transparent; }
    }

    /* Centered image with white background panel */
    #secretImage {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);  /* Perfect centering */

      width: 60vw;          /* Slightly smaller */
      height: auto;
      max-height: 70vh;

      object-fit: contain;

      background: white;
      padding: 20px;
      box-shadow: 0 0 40px rgba(255,255,255,0.4);

      opacity: 0;
      z-index: 9999;
      animation: fadeInImage 1.2s forwards;
    }

    /* Simple fade-in (no glitch shutdown) */
    @keyframes fadeInImage {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Wrong password shake */
    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }
    .shake { animation: shake 0.4s; }

    input {
      padding: 10px;
      font-size: 18px;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #FF0000; /* Red bar */
      color: #000000; /* Black text */
    }

    /* Make placeholder text black instead of gray */
    input::placeholder {
      color: #000000;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-left: 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #FF0000; /* Red button */
      color: #000000; /* Black text */
    }
  </style>
</head>
<body>

  <!-- Typewriter text -->
  <div id="typewriter"></div>

  <!-- Password input -->
  <input type="password" id="passwordInput" placeholder="Password">
  <button onclick="checkPassword()">Submit</button>

  <!-- Secret image -->
  <img id="secretImage" src="spoiler.png" alt="Secret Image">

  <!-- Audio -->
  <audio id="secretAudio" src="excusemejacob.ogg"></audio>
  <audio id="loopAudio" src="compooper.mp3" loop></audio>

  <script>
    /* TYPEWRITER EFFECT */
    const text = "Enter Password";
    let i = 0;
    function typeWriter() {
      if (i < text.length) {
        document.getElementById("typewriter").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 80);
      }
    }
    typeWriter();

    const loopAudio = document.getElementById("loopAudio");
    let loopStarted = false;

    /* PASSWORD CHECK */
    function checkPassword() {
      const inputBox = document.getElementById("passwordInput");
      const input = inputBox.value.toLowerCase();
      const correctPassword = "excuse me pwned";

      // Start looping audio on first interaction
      if (!loopStarted) {
        loopAudio.play().catch(() => {});
        loopStarted = true;
      }

      if (input === correctPassword.toLowerCase()) {
        /* Stop looping audio */
        loopAudio.pause();
        loopAudio.currentTime = 0;

        /* Switch background to white */
        document.body.style.backgroundColor = "#FFFFFF";

        /* Show centered image */
        const img = document.getElementById("secretImage");
        img.style.display = "block";

        /* Play main audio */
        const audio = document.getElementById("secretAudio");
        audio.play();

      } else {
        inputBox.classList.add("shake");
        setTimeout(() => {
          inputBox.classList.remove("shake");
        }, 400);
      }
    }
  </script>

</body>
</html>
