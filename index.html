<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>G,U ESS    WH O</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #eee;
      text-align: center;
      padding-top: 80px;
      overflow: hidden; /* Prevent scrollbars when image appears */
    }

    /* Typewriter effect */
    #typewriter {
      font-size: 24px;
      border-right: 2px solid #eee;
      width: fit-content;
      margin: 0 auto 20px auto;
      white-space: nowrap;
      overflow: hidden;
    }

    /* Fullscreen hidden image */
    #secretImage {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      opacity: 0;
      z-index: 9999;
      animation: glitchFade 1.5s forwards;
    }

    /* Glitch fade-in animation */
    @keyframes glitchFade {
      0% { opacity: 0; transform: translate(0,0); }
      20% { opacity: 0.3; transform: translate(-5px, 3px); filter: hue-rotate(30deg); }
      40% { opacity: 0.6; transform: translate(4px, -4px); filter: hue-rotate(-20deg); }
      60% { opacity: 0.8; transform: translate(-3px, 2px); filter: hue-rotate(10deg); }
      100% { opacity: 1; transform: translate(0,0); filter: none; }
    }

    /* Shake animation for wrong password */
    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }

    .shake {
      animation: shake 0.4s;
    }

    input {
      padding: 10px;
      font-size: 18px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-left: 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Typewriter text -->
  <div id="typewriter"></div>

  <!-- Password input -->
  <input type="password" id="passwordInput" placeholder="Password">
  <button onclick="checkPassword()">Submit</button>

  <!-- Secret fullscreen image -->
  <img id="secretImage" src="spoiler.png" alt="Secret Image">

  <!-- Audio -->
  <audio id="secretAudio" src="excusemejacob.ogg"></audio>

  <script>
    // TYPEWRITER EFFECT
    const text = "Enter Password";
    let i = 0;
    function typeWriter() {
      if (i < text.length) {
        document.getElementById("typewriter").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 80);
      }
    }
    typeWriter();

    // PASSWORD CHECK
    function checkPassword() {
      const inputBox = document.getElementById("passwordInput");
      const input = inputBox.value.toLowerCase();
      const correctPassword = "excuse me pwned";

      if (input === correctPassword.toLowerCase()) {
        // Show fullscreen glitch fade-in image
        const img = document.getElementById("secretImage");
        img.style.display = "block";

        // Play audio
        const audio = document.getElementById("secretAudio");
        audio.play();
      } else {
        // Wrong password shake animation
        inputBox.classList.add("shake");
        setTimeout(() => {
          inputBox.classList.remove("shake");
        }, 400);
      }
    }
  </script>

</body>
</html>
